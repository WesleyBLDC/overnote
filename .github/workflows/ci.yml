name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The npm that honors package.json "allowScripts"; Node 22 bundles npm 10, which ignores it.
  NPM_VERSION: 11.19.0
  # Fail the install if a dependency brings an install script nobody reviewed.
  npm_config_strict_allow_scripts: "true"
  # Logs from the helper scripts land here when a step fails, for the artifact upload.
  OVERNOTE_LOG_DIR: ${{ github.workspace }}/.ci-logs
  # GitHub's macOS runners log in a GUI session, which the panel window checks need. If a runner
  # image ever lacks one, set the repository variable OVERNOTE_WINDOW_E2E to 0 to skip only
  # that step; unset, scripts/verify.sh runs it whenever CI is true.
  OVERNOTE_WINDOW_E2E: ${{ vars.OVERNOTE_WINDOW_E2E }}

jobs:
  verify:
    name: Verify (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Swift build
        uses: actions/cache@v6
        with:
          path: helper/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helper/Package.swift', 'helper/Package.resolved', 'helper/Sources/**', 'helper/Tests/**', 'helper/Tools/**') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # The whole suite, the same command contributors run locally: version, typechecks, lint,
      # builds, unit tests, every end to end suite (the panel window one included in CI), and
      # the Raycast build. It names the step that failed. The editor Playwright suite, the
      # longest step, runs in the editor-e2e job beside this one instead.
      - name: Verify
        run: npm run verify
        env:
          OVERNOTE_EDITOR_E2E: "0"

      - name: Upload helper logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: helper-logs
          path: ${{ env.OVERNOTE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14

  editor-e2e:
    name: Editor end to end (Playwright)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The verify job saves this cache; restoring is enough here.
      - name: Restore Swift build
        uses: actions/cache/restore@v6
        with:
          path: helper/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helper/Package.swift', 'helper/Package.resolved', 'helper/Sources/**', 'helper/Tests/**', 'helper/Tools/**') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # tests/real-helper.spec.ts drives the real helper binary.
      - name: Build helper
        run: npm run build:helper

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit

      - name: End to end (Playwright)
        run: npm run test:e2e -w editor

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            editor/playwright-report
            editor/test-results
          if-no-files-found: ignore
          retention-days: 14
